<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f5f8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0f14" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/icono.svg?v=dragon3" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icono-180.png?v=dragon3" />
    <!-- Con la sesión de Access: sin credenciales, el manifiesto no pasaría por el inicio de sesión -->
    <link rel="manifest" href="/manifest-ti.webmanifest" crossorigin="use-credentials" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" />
    <script>
      // Aplica el tema elegido antes de pintar, para que no parpadee
      try {
        var tema = localStorage.getItem("tema");
        if (tema === "claro" || tema === "oscuro") {
          document.documentElement.dataset.tema = tema;
          document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) {
            m.content = tema === "oscuro" ? "#0b0f14" : "#f4f5f8";
          });
        }
      } catch (e) {}
    </script>
    <title>AulaViva</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f5f8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0f14" media="(prefers-color-scheme: dark)" />
    <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />
    <link rel="apple-touch-icon" href="/icono-180.png?v=dragon3" />
    <link rel="icon" href="/icono.svg?v=dragon3" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- La fuente carga sin bloquear: con datos lentos la página se ve primero con la del sistema -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" media="print" onload="this.media='all'" />
    <script>
      // Aplica el tema elegido antes de pintar, para que no parpadee
      try {
        var tema = localStorage.getItem("tema");
        if (tema === "claro" || tema === "oscuro") {
          document.documentElement.dataset.tema = tema;
          document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) {
            m.content = tema === "oscuro" ? "#0b0f14" : "#f4f5f8";
          });
        }
      } catch (e) {}
    </script>
    <title>Reportar falla · AulaViva</title>
  </head>
  <body>
    <main id="app" aria-live="polite"><p class="suave">Cargando…</p></main>
    <script type="module" src="/src/qr/qr.ts"></script>
  </body>
</html>
